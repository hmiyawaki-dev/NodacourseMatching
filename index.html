<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神戸野田高校おすすめコース診断</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; background-color: #f9f9f9; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        .question-block { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .question-text { font-weight: bold; margin-bottom: 10px; }
        .options label { display: inline-block; margin-right: 15px; cursor: pointer; }
        .btn { display: block; width: 100%; padding: 15px; background-color: #3498db; color: #fff; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 20px; transition: background-color 0.3s; }
        .btn:hover { background-color: #2980b9; }
        .result-box { background-color: #e8f6f3; padding: 20px; border-radius: 5px; margin-top: 20px; text-align: center; }
        .course-name { font-size: 24px; font-weight: bold; color: #1abc9c; margin: 10px 0; }
        .img-placeholder { width: 100%; height: 150px; background-color: #ddd; display: flex; align-items: center; justify-content: center; color: #777; margin: 10px 0; border-radius: 5px; }
        .scholarship-text { font-weight: bold; color: #e74c3c; margin-top: 15px; }
        .disclaimer { font-size: 12px; font-weight: bold; color: #c0392b; margin-top: 30px; padding-top: 15px; border-top: 2px dashed #c0392b; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>おすすめコース診断</h1>

    <!-- フェーズ1：質問エリア -->
    <div id="phase1">
        <p>以下の6つの質問にお答えください。</p>
        <form id="quizForm"></form>
        <button class="btn" onclick="calculatePhase1()">おすすめコースを見る</button>
    </div>

    <!-- フェーズ1：結果エリア -->
    <div id="phase1-result" class="hidden">
        <h2>あなたの興味に合うコース</h2>
        <div id="p1-courses" class="result-box"></div>
        <p style="text-align:center; margin-top:20px;">この結果をもとに、さらに詳しい判定を行いますか？</p>
        <button class="btn" onclick="showPhase2()">あなたの成績とおすすめコースをマッチングする</button>
    </div>

    <!-- フェーズ2：成績入力エリア -->
    <div id="phase2" class="hidden">
        <h2>成績マッチング</h2>
        <div class="question-block">
            <p class="question-text">5教科の通知表の成績と最も近いものを選んでください。</p>
            <select id="gradeSelect" style="width: 100%; padding: 10px; font-size: 16px;">
                <option value="22">5計22以上</option>
                <option value="20">5計20以上（5計オール4）</option>
                <option value="18">5計18以上</option>
                <option value="15">5計15以上（5計オール3）</option>
                <option value="14">5計15以下</option>
            </select>
        </div>
        <button class="btn" onclick="calculatePhase2()">最終結果を見る</button>
    </div>

    <!-- フェーズ2：最終結果エリア -->
    <div id="phase2-result" class="hidden">
        <h2>最終マッチング結果</h2>
        <div id="final-output"></div>
        
        <div class="disclaimer">
            【注意事項】<br>この結果は合格をお約束するものではありません。<br>詳しいお話は個別相談でお伺いします。
        </div>
    </div>
</div>

<script>
    // --- 質問データ ---
    const questions = [
        "①大学進学を第一に考えている。",
        "②海外留学に興味がある。",
        "③放課後および土曜日の徹底的な補習指導に興味がある。",
        "④部活動（特に運動部）に取り組みたい。",
        "⑤部活動で全国レベルでの活躍の実績がある。",
        "⑥教科書とはまた違う、興味関心に応じた選択科目に魅力を感じる。"
    ];

    // --- 質問の自動生成 ---
    const form = document.getElementById('quizForm');
    questions.forEach((q, index) => {
        const qNum = index + 1;
        form.innerHTML += `
            <div class="question-block">
                <div class="question-text">${q}</div>
                <div class="options">
                    <label><input type="radio" name="q${qNum}" value="yes"> はい</label>
                    <label><input type="radio" name="q${qNum}" value="no"> いいえ</label>
                    <label><input type="radio" name="q${qNum}" value="neither" checked> どちらともいえない</label>
                </div>
            </div>
        `;
    });

    // グローバル変数
    let recommendedP1 = [];

    // --- フェーズ1判定ロジック ---
    function calculatePhase1() {
        // 各コースの初期スコア
        let scores = {
            "特進S[SS]": 0, "特進S[S]": 0, "特進GE[SG]": 0, 
            "特進GE[G]": 0, "特進A[文理国際]": 0, "特進A[スポーツ]": 0, "進学総合": 0
        };

        const ans = {};
        let allNeither = true;
        let allNo = true;

        for (let i = 1; i <= 6; i++) {
            const val = document.querySelector(`input[name="q${i}"]:checked`).value;
            ans[`q${i}`] = val;
            if (val !== "neither") allNeither = false;
            if (val !== "no" && val !== "neither") allNo = false;
        }

        // スコア加算・減算処理 (★=100, -1000 / 〇=10)
        if (ans.q1 === "yes") { scores["特進S[SS]"]+=10; scores["特進S[S]"]+=10; scores["特進GE[SG]"]+=10; scores["特進GE[G]"]+=10; scores["特進A[文理国際]"]+=10; }
        
        if (ans.q2 === "yes") { scores["特進GE[SG]"]+=100; scores["特進GE[G]"]+=100; }
        else if (ans.q2 === "no") { scores["特進GE[SG]"]-=1000; scores["特進GE[G]"]-=1000; }
        
        if (ans.q3 === "yes") { scores["特進S[SS]"]+=100; scores["特進GE[SG]"]+=100; }
        else if (ans.q3 === "no") { scores["特進S[SS]"]-=1000; scores["特進GE[SG]"]-=1000; }
        
        if (ans.q4 === "yes") { scores["特進S[S]"]+=10; scores["特進GE[G]"]+=10; scores["特進A[文理国際]"]+=10; scores["特進A[スポーツ]"]+=10; scores["進学総合"]+=10; }
        
        if (ans.q5 === "yes") { scores["特進A[スポーツ]"]+=100; }
        else if (ans.q5 === "no") { scores["特進A[スポーツ]"]-=1000; }
        
        if (ans.q6 === "yes") { scores["進学総合"]+=100; }
        else if (ans.q6 === "no") { scores["進学総合"]-=1000; }

        recommendedP1 = [];
        let maxScore = -1;
        for (let course in scores) {
            if (scores[course] > 0) {
                if (scores[course] > maxScore) maxScore = scores[course];
            }
        }
        for (let course in scores) {
            if (scores[course] > 0 && scores[course] === maxScore) {
                recommendedP1.push(course);
            }
        }

        // 例外処理（フォールバック）
        if (allNeither) {
            recommendedP1 = ["特進S[S]", "特進GE[G]", "特進A[文理国際]", "進学総合"];
        } else if (recommendedP1.length === 0) {
            recommendedP1 = ["特進S[S]", "特進A[文理国際]", "進学総合"];
        }

        document.getElementById('p1-courses').innerHTML = `<div class="course-name">${recommendedP1.join(' / ')}</div>`;
        document.getElementById('phase1').classList.add('hidden');
        document.getElementById('phase1-result').classList.remove('hidden');
    }

    function showPhase2() {
        document.getElementById('phase1-result').classList.add('hidden');
        document.getElementById('phase2').classList.remove('hidden');
    }

    // --- フェーズ2判定ロジック ---
    function calculatePhase2() {
        const grade = parseInt(document.getElementById('gradeSelect').value);
        let targetGroup = [];
        let scholarship = "";

        if (grade >= 22) {
            targetGroup = ["特進S[SS]", "特進GE[SG]"];
            scholarship = "入試特待Ａ";
        } else if (grade >= 20) {
            targetGroup = ["特進S[SS]", "特進S[S]", "特進GE[SG]", "特進GE[G]"];
            scholarship = "入試特待Ｂ";
        } else if (grade >= 18) {
            targetGroup = ["特進S[S]", "特進GE[G]"];
            scholarship = "入試特待Ｃ";
        } else if (grade >= 15) {
            targetGroup = ["特進A[文理国際]", "特進A[スポーツ]"];
        } else {
            targetGroup = ["進学総合"];
        }

        // マッチング（積集合）
        const finalCourses = recommendedP1.filter(course => targetGroup.includes(course));
        const outputDiv = document.getElementById('final-output');
        outputDiv.innerHTML = "";

        if (finalCourses.length > 0) {
            // マッチング成功
            finalCourses.forEach(course => {
                outputDiv.innerHTML += `
                    <div class="result-box">
                        <p>あなたにオススメのコースは</p>
                        <div class="course-name">${course}</div>
                        <!-- 画像追加時はここを書き換え -->
                        <!-- <img src="img/course_${course}.jpg" alt="${course}の画像" style="width:100%;"> -->
                        <div class="img-placeholder">（${course}の画像が表示されます）</div>
                    </div>
                `;
            });

            if (scholarship !== "") {
                outputDiv.innerHTML += `
                    <div class="result-box" style="background-color: #fff3e0;">
                        <p class="scholarship-text">また、専願でご受験いただければ<br>【${scholarship}】が適応できるかもしれません。</p>
                        <!-- 画像追加時はここを書き換え -->
                        <!-- <img src="img/tokutai_${scholarship}.jpg" alt="${scholarship}の画像" style="width:100%;"> -->
                        <div class="img-placeholder" style="background-color: #ffe0b2;">（${scholarship}の案内画像が表示されます）</div>
                    </div>
                `;
            }
        } else {
            // マッチング0件の場合のフォロー
            let fallbackCourse = targetGroup[0]; // 現実的なおすすめコース
            let idealCourse = recommendedP1[0]; // 理想のコース
            
            outputDiv.innerHTML = `
                <div class="result-box" style="background-color: #fdf2e9;">
                    <p>あなたの希望に合う <strong>${idealCourse}</strong> を目指すには、さらに成績アップが必要です！<br>
                    今の成績から確実に入学できる現実的なおすすめコースは <strong>${fallbackCourse}</strong> です。</p>
                </div>
            `;
            
            if (scholarship !== "") {
                 outputDiv.innerHTML += `
                    <div class="result-box" style="background-color: #fff3e0;">
                        <p class="scholarship-text">また、専願でご受験いただければ<br>【${scholarship}】が適応できるかもしれません。</p>
                        <div class="img-placeholder" style="background-color: #ffe0b2;">（${scholarship}の案内画像が表示されます）</div>
                    </div>
                `;
            }
        }

        document.getElementById('phase2').classList.add('hidden');
        document.getElementById('phase2-result').classList.remove('hidden');
    }
</script>

</body>
</html>
